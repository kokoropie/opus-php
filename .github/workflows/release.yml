name: Build Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────
  # Linux (.so)
  # ─────────────────────────────────────────────
  build-linux:
    name: Build Linux (.so)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["8.1", "8.2", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libopus-dev libclang-dev clang

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none

      # ext-php-rs build.rs looks for `php-config` via the PHP_CONFIG env var.
      # setup-php installs a versioned binary (php-config8.2 etc), so we resolve
      # the real path here and export it.
      - name: Expose php-config path
        run: |
          PHP_CONFIG_BIN=$(which php-config${{ matrix.php }} 2>/dev/null \
            || which php-config$(echo "${{ matrix.php }}" | cut -d. -f1) 2>/dev/null \
            || which php-config 2>/dev/null)
          echo "Found php-config at: $PHP_CONFIG_BIN"
          echo "PHP_CONFIG=$PHP_CONFIG_BIN" >> "$GITHUB_ENV"

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-cargo-php${{ matrix.php }}-${{ hashFiles('Cargo.toml') }}
          restore-keys: linux-cargo-php${{ matrix.php }}-

      - name: Build
        run: cargo build --release

      - name: Rename artifact
        run: |
          mkdir -p dist
          cp target/release/libopusphp.so dist/libopusphp-linux-php${{ matrix.php }}.so

      - uses: actions/upload-artifact@v4
        with:
          name: linux-php${{ matrix.php }}
          path: dist/libopusphp-linux-php${{ matrix.php }}.so

  # ─────────────────────────────────────────────
  # macOS (.dylib)
  # ─────────────────────────────────────────────
  build-macos:
    name: Build macOS (.dylib)
    runs-on: macos-latest
    strategy:
      matrix:
        php: ["8.1", "8.2", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: brew install opus

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none

      - name: Expose php-config path
        run: |
          PHP_CONFIG_BIN=$(which php-config${{ matrix.php }} 2>/dev/null \
            || which php-config$(echo "${{ matrix.php }}" | cut -d. -f1) 2>/dev/null \
            || which php-config 2>/dev/null)
          echo "Found php-config at: $PHP_CONFIG_BIN"
          echo "PHP_CONFIG=$PHP_CONFIG_BIN" >> "$GITHUB_ENV"

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-cargo-php${{ matrix.php }}-${{ hashFiles('Cargo.toml') }}
          restore-keys: macos-cargo-php${{ matrix.php }}-

      - name: Build
        run: cargo build --release

      - name: Rename artifact
        run: |
          mkdir -p dist
          cp target/release/libopusphp.dylib dist/libopusphp-macos-php${{ matrix.php }}.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: macos-php${{ matrix.php }}
          path: dist/libopusphp-macos-php${{ matrix.php }}.dylib

  # ─────────────────────────────────────────────
  # Windows (.dll)
  # ext-php-rs on Windows requires:
  #   - Rust NIGHTLY (abi_vectorcall is nightly-only)
  #   - PHP from windows.php.net (setup-php provides this)
  #   - libopus via vcpkg (pre-installed at C:\vcpkg on windows-latest)
  #   - rust-lld linker (avoids MSVC linker version mismatches with PHP)
  # ─────────────────────────────────────────────
  build-windows:
    name: Build Windows (.dll)
    runs-on: windows-latest
    strategy:
      matrix:
        php: ["8.1", "8.2", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none

      # windows-latest ships with vcpkg at C:\vcpkg — no need for cargo-vcpkg
      - name: Install libopus via vcpkg
        shell: pwsh
        run: |
          vcpkg integrate install
          vcpkg install opus:x64-windows

      # ext-php-rs requires Rust nightly on Windows for the abi_vectorcall feature
      - name: Install Rust (nightly, MSVC)
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-pc-windows-msvc

      # rust-lld avoids MSVC linker conflicts with PHP's Windows SDK
      - name: Configure rust-lld linker
        shell: pwsh
        run: |
          $configPath = "$env:USERPROFILE\.cargo\config.toml"
          $block = "`n[target.x86_64-pc-windows-msvc]`nlinker = `"rust-lld`"`n"
          if (-not (Test-Path $configPath) -or -not (Select-String "rust-lld" $configPath -Quiet)) {
            Add-Content -Path $configPath -Value $block
          }

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-php${{ matrix.php }}-${{ hashFiles('Cargo.toml') }}
          restore-keys: windows-cargo-php${{ matrix.php }}-

      - name: Build
        shell: pwsh
        run: cargo build --release
        env:
          VCPKG_ROOT: C:\vcpkg
          VCPKGRS_DYNAMIC: "1"

      - name: Rename artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          # Cargo converts hyphens to underscores in cdylib output names
          Copy-Item target\release\opus_php.dll dist\libopusphp-windows-php${{ matrix.php }}.dll

      - uses: actions/upload-artifact@v4
        with:
          name: windows-php${{ matrix.php }}
          path: dist\libopusphp-windows-php${{ matrix.php }}.dll

  # ─────────────────────────────────────────────
  # Publish GitHub Release
  # ─────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [build-linux, build-macos, build-windows]
    if: always() && (needs.build-linux.result == 'success' || needs.build-macos.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List downloaded files
        run: ls -R artifacts/

      - name: Create Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: artifacts/**/*