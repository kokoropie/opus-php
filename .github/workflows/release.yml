name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: libopusphp.so
            asset_name: opusphp-linux.so
            rust_toolchain: stable
          - os: macos-latest
            artifact_name: libopusphp.dylib
            asset_name: opusphp-macos.dylib
            rust_toolchain: stable
          - os: windows-latest
            artifact_name: opusphp.dll
            asset_name: opusphp-windows.dll
            rust_toolchain: nightly 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust_toolchain }}
          targets: ${{ matrix.os == 'windows-latest' && 'x86_64-pc-windows-msvc' || '' }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: openssl, mbstring

      - name: Install Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libopus-dev clang pkg-config

      - name: Install Dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install opus

      - name: Install Dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          vcpkg install opus:x64-windows
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      - name: Build Extension
        run: cargo build --release

      - name: Prepare Artifact
        shell: bash
        run: |
          mkdir dist
          # Windows builds often name the file 'opusphp.dll' instead of 'libopusphp.dll'
          # We use a wildcard search to find the resulting library regardless of prefix
          find target/release -maxdepth 1 \( -name "*.so" -o -name "*.dylib" -o -name "*.dll" \) -exec cp {} dist/${{ matrix.asset_name }} \;

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}

  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all compiled artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true